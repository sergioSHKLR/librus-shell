name: Apply FS policy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-fs-policy.yml"
      - "scripts/apply_fs_policy.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_fs_policy.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --staged --quiet || git commit -m "fix(pwa): disable Fullscreen API on tall Android phones"
          git rm -f .github/workflows/apply-fs-policy.yml scripts/apply_fs_policy.py
          git commit -m "chore: remove one-shot FS policy workflow" || true
          git push origin HEAD:main
