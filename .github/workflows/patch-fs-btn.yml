name: Restore FS button

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/patch-fs-btn.yml"
      - "scripts/restore_fs_btn.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_fs_btn.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --staged --quiet || git commit -m "fix(pwa): show manual fullscreen button on Android portrait"
          git rm -f .github/workflows/patch-fs-btn.yml scripts/restore_fs_btn.py
          git commit -m "chore: remove one-shot FS restore helpers" || true
          git push origin HEAD:main
